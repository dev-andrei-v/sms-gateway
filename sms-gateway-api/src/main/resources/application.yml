spring:
  application:
    name: sms-gateway-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    baseline-on-migrate: true  # Allow migrations on existing databases
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

logging:
  level:
    org.springframework.core.env: DEBUG

sms-gateway:
  cors:
    allowed-origins: ${SMS_GATEWAY_CORS_ALLOWED_ORIGINS:*}
  portability:
    baseUrl: ${PORTABILITATE_BASE_URL:https://www.portabilitate.ro}
    sslVerify: ${PORTABILITATE_SSL_VERIFY:true}
    allowInsecureSslFallback: ${PORTABILITATE_ALLOW_INSECURE_SSL_FALLBACK:true}
    timeoutSeconds: ${PORTABILITATE_TIMEOUT_SECONDS:15}
  device-ws:
    shared-key: ${SMS_DEVICE_WS_SHARED_KEY:}
    ack-timeout-seconds: ${SMS_DEVICE_WS_ACK_TIMEOUT:30}
  otp-template: ${SMS_OTP_TEMPLATE:Your one-time authentication code is: {code}}
  authentik:
    token: ${AUTHENTIK_API_TOKEN:}